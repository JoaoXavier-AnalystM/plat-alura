name: Workflow CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug folders
        run: ls -R
        working-directory: PE/allbooks-aula-01

      - name: Install dependencies
        run: npm install
        working-directory: PE/allbooks-aula-01

      - name: Run tests
        run: npm test
        working-directory: PE/allbooks-aula-01